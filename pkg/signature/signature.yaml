# signature模块配置文件
# 模块名称: signature
# 包名: signature  
# 描述: 数字签名模块
# 生成时间: 2026-05-15 16:19:59
# 注意: 此文件由配置生成器自动生成

# 模块名称
module-name: signature
# 是否启用签名验证
enabled: false
# 签名类型 (hmac/rsa)
type: hmac
# HMAC 签名密钥
secret-key: default-secret-key-change-in-production
# RSA 公钥 PEM（用于验证签名）
public-key-pem: ""
# Nonce Redis key 前缀
nonce-key-prefix: 'nonce:'
# Nonce 过期时间
nonce-ttl: 10m0s
# 是否强制要求 Timestamp（向后兼容：false 允许旧客户端不传）
require-timestamp: false
# 是否强制要求 Nonce（向后兼容：false 允许旧客户端不传）
require-nonce: false
# 签名算法 (MD5, SHA1, SHA224, SHA256, SHA384, SHA512)
algorithm: SHA256
# 请求时间窗口
timeout-window: 5m0s
# 忽略签名验证的路径
ignore-paths:
    - /health
    - /metrics
    - /ping
# 是否跳过查询参数
skip-query: false
# 不参与签名计算的 headers
skip-headers:
    - Authorization
    - User-Agent
    - Accept
    - Accept-Encoding
    - Accept-Language
    - Connection
    - Cache-Control
    - X-Signature
# 签名校验必须包含的 headers
required-headers:
    - X-Timestamp
    - Content-Type
# 时间戳格式
timestamp-format: unix
# 是否跳过请求体
skip-body: false
