# pprof模块配置文件
# 模块名称: pprof
# 包名: pprof  
# 描述: 性能分析模块
# 生成时间: 2026-09-10 12:25:27
# 注意: 此文件由配置生成器自动生成

# 模块名称
module-name: PProf
# 是否启用PProf
enabled: false
# PProf路径前缀
path-prefix: /debug/pprof
# PProf服务端口
port: 6060
# 启用的性能分析
enable-profiles:
    cpu: true
    goroutine: true
    block: false
    mutex: false
    heap: true
    allocs: true
    threadcreate: false
    trace: false
# 采样配置
sampling:
    memory-rate: 524288
    block-rate: 1
    mutex-fraction: 1
# 认证配置
authentication:
    # 是否启用PProf
    enabled: false
    auth-token: ""
    allowed-ips: []
    require-auth: false
